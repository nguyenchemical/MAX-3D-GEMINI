<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Max 3D+ AI Pro</title>

    <!-- Hỗ trợ Icon khi thêm vào màn hình chính (Add to Home Screen) -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    
    <!-- Cấu hình thanh trạng thái cho iOS/iPadOS/Android (Fullscreen / PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Max 3D+ AI">

    <!-- Cấu hình dành cho Android / Chrome (PWA) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ed1c24">
    
    <link rel="icon" sizes="192x192" href="icon.png">
    <link rel="icon" sizes="512x512" href="icon.png">

    <!-- Link Font và Library xác pháo -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { --vietlott-red: #ed1c24; --gold: #ffd700; }
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(180deg, #ed1c24 0%, #7b0a0e 100%); 
            color: white; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            touch-action: manipulation;
        }
        
        /* Utility bar cho Zoom & Status */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 15px;
            background: rgba(0, 0, 0, 0.25);
            font-size: 11px;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .led-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #00ff00;
            box-shadow: 0 0 8px #00ff00;
        }
        .led-indicator.connecting {
            animation: blink 0.6s infinite alternate;
            background-color: #ffcc00;
            box-shadow: 0 0 8px #ffcc00;
        }
        @keyframes blink {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }
        .zoom-controls button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            border-radius: 4px;
            padding: 2px 8px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 3px;
        }
        
        .app-wrapper { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            max-width: 500px; 
            margin: 0 auto; 
            width: 100%; 
            padding: 10px 15px 15px 15px;
            transition: transform 0.2s ease;
            transform-origin: top center;
        }
        
        .result-container { 
            flex: 1; 
            background: rgba(0,0,0,0.2); 
            border-radius: 25px; 
            margin: 10px 0; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            border: 1px solid rgba(255,255,255,0.2); 
            padding: 15px; 
            overflow-y: auto; 
            position: relative;
        }
        
        /* Max 3D+ Ball Style */
        .set-row { display: flex; justify-content: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
        .digit-box { 
            width: 50px; 
            height: 70px; 
            background: white; 
            color: #333; 
            border-radius: 10px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 28px; 
            font-weight: 800; 
            box-shadow: 0 5px 0 #ccc; 
            border: 2px solid #ddd; 
            animation: popIn 0.3s ease;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @media (max-width: 350px) { .digit-box { width: 40px; height: 60px; font-size: 24px; } }
        
        .btn-main { 
            background: var(--gold); 
            border: none; 
            padding: 15px; 
            border-radius: 15px; 
            color: #7b0a0e; 
            font-weight: 800; 
            font-size: 16px; 
            cursor: pointer; 
            box-shadow: 0 5px 0 #b8860b; 
            margin-top: 5px; 
            transition: all 0.1s; 
            width: 100%;
        }
        .btn-main:active { transform: translateY(4px); box-shadow: 0 1px 0 #b8860b; }
        
        #meter-box { width: 100%; margin-top: 15px; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; }
        .bar-bg { height: 14px; background: #333; border-radius: 10px; overflow: hidden; position: relative; }
        #bar-fill { 
            height: 100%; 
            width: 0%; 
            background: linear-gradient(90deg, #00ff00 0%, #ffd700 60%, #ff0000 100%); 
            transition: width 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67); 
        }
        
        .high-alert-tag {
            display: inline-block;
            background: #ff0000;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 5px;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .advice-box {
            margin-top: 10px;
            font-size: 12px;
            text-align: center;
            font-weight: 600;
            padding: 6px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
        }

        /* Modal Alert */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: #fff;
            color: #333;
            padding: 20px;
            border-radius: 15px;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 3px solid var(--vietlott-red);
        }
        .modal-card h3 { color: var(--vietlott-red); margin-top: 0; }
        .modal-card button {
            background: var(--vietlott-red);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="status-badge">
        <div id="ledIndicator" class="led-indicator"></div>
        <span id="ledStatus">KẾT NỐI VIETLOTT REALTIME</span>
    </div>
    <div class="zoom-controls">
        <button onclick="changeZoom(-0.1)">-</button>
        <button onclick="resetZoom()">100%</button>
        <button onclick="changeZoom(0.1)">+</button>
    </div>
</div>

<div class="app-wrapper" id="appWrapper">
    <header style="text-align:center;">
        <h2 style="margin:5px 0;">MAX 3D+ AI PRO</h2>
        <div style="font-size:12px; opacity:0.8;">Luật chơi: 2 bộ số, mỗi bộ 3 chữ số (000-999)</div>
        <div id="drawInfo" style="font-size:11px; color:#ffd700; margin-top:3px; font-weight:600;">Kỳ quay kế tiếp: ---</div>
    </header>

    <main class="result-container">
        <div id="resultDisplay" style="text-align:center; width:100%;">
            <p style="opacity:0.6;">Nhấn nút để bắt đầu phân tích</p>
        </div>

        <div id="meter-box">
            <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; margin-bottom:5px;">
                <span>Jackpot Meter <span id="highAlertBadge"></span></span>
                <span id="percent-label" style="font-weight:bold; color:#ffd700;">0%</span>
            </div>
            <div class="bar-bg"><div id="bar-fill"></div></div>
            <div id="adviceBox" class="advice-box">Sẵn sàng phân tích dữ liệu...</div>
        </div>
    </main>

    <button class="btn-main" onclick="handleAnalysis()">PHÂN TÍCH BỘ SỐ MỚI</button>
</div>

<!-- Modal Thông báo High Alert -->
<div class="modal-overlay" id="alertModal">
    <div class="modal-card">
        <h3>🚨 HIGH ALERT (≥90%)</h3>
        <p id="modalMsg">Bộ số đạt xác suất nổ cực cao theo phân tích AI thời gian thực!</p>
        <button onclick="closeModal()">ĐÃ HỂU</button>
    </div>
</div>

<script>
    let currentScale = 1;

    function changeZoom(delta) {
        currentScale += delta;
        if (currentScale < 0.7) currentScale = 0.7;
        if (currentScale > 1.4) currentScale = 1.4;
        document.getElementById('appWrapper').style.transform = `scale(${currentScale})`;
    }

    function resetZoom() {
        currentScale = 1;
        document.getElementById('appWrapper').style.transform = `scale(1)`;
    }

    // Web Audio API để phát âm thanh không cần file ngoài
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(freq = 600, type = 'sine', duration = 0.1) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
    }

    function playHighAlertSound() {
        playBeep(800, 'square', 0.15);
        setTimeout(() => playBeep(1200, 'square', 0.25), 150);
    }

    function triggerVibration(pattern) {
        if ("vibrate" in navigator) {
            navigator.vibrate(pattern);
        }
    }

    // Xác định kỳ quay kế tiếp (T2, T4, T6 lúc 18:00)
    function getNextDrawTime() {
        const now = new Date();
        let target = new Date(now);
        
        // Days of week: 0: Sun, 1: Mon, 2: Tue, 3: Wed, 4: Thu, 5: Fri, 6: Sat
        const drawDays = [1, 3, 5]; 
        
        let found = false;
        for (let dayOffset = 0; dayOffset <= 7; dayOffset++) {
            let checkDate = new Date(now.getTime() + dayOffset * 24 * 60 * 60 * 1000);
            let dayOfWeek = checkDate.getDay();
            
            if (drawDays.includes(dayOfWeek)) {
                checkDate.setHours(18, 0, 0, 0);
                if (checkDate > now) {
                    target = checkDate;
                    found = true;
                    break;
                }
            }
        }

        const daysVi = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
        const dayStr = daysVi[target.getDay()];
        const dateStr = `${target.getDate().toString().padStart(2, '0')}/${(target.getMonth() + 1).toString().padStart(2, '0')}/${target.getFullYear()}`;
        return `${dayStr}, 18:00 (${dateStr})`;
    }

    function updateDrawInfo() {
        document.getElementById('drawInfo').innerText = `Kỳ quay kế tiếp: ${getNextDrawTime()}`;
    }

    // Mô phỏng kết nối thời gian thực Vietlott
    function simulateRealtimeConnection() {
        const led = document.getElementById('ledIndicator');
        const status = document.getElementById('ledStatus');
        
        // Khi bấm nút phân tích: nhấp nháy đèn báo hiệu đang truy vấn Vietlott
        led.classList.add('connecting');
        status.innerText = "ĐANG TRUY VẤN VIETLOTT...";
        
        setTimeout(() => {
            led.classList.remove('connecting');
            status.innerText = "ĐÃ KẾT NỐI REALTIME VIETLOTT";
        }, 1200);
    }

    // Hàm tạo số 3 chữ số (000-999)
    function generate3Digits() {
        return Math.floor(Math.random() * 1000).toString().padStart(3, '0');
    }

    // Logic xử lý chính
    function handleAnalysis() {
        // Âm thanh + Rung khi bấm nút
        playBeep(400, 'sine', 0.08);
        triggerVibration(50);

        // Mô phỏng hiệu ứng kết nối
        simulateRealtimeConnection();

        // 1. Tạo 2 bộ số, đảm bảo không trùng nhau đúng quy định Max 3D+
        let set1 = generate3Digits();
        let set2 = generate3Digits();
        
        while (set1 === set2) {
            set2 = generate3Digits();
        }

        // 2. Hiển thị lên giao diện sau khoảng trễ mô phỏng dữ liệu thời gian thực
        setTimeout(() => {
            const display = document.getElementById('resultDisplay');
            display.innerHTML = `
                <div style="margin-bottom:10px; font-weight:bold; color:#ffd700;">BỘ SỐ 1</div>
                <div class="set-row">${renderDigits(set1)}</div>
                <div style="margin:15px 0 10px 0; font-weight:bold; color:#ffd700;">BỘ SỐ 2</div>
                <div class="set-row">${renderDigits(set2)}</div>
            `;

            // Âm thanh + Rung khi có kết quả
            playBeep(800, 'sine', 0.12);
            triggerVibration([100, 50, 100]);

            // 3. Chạy Jackpot Meter & Logic AI
            animateMeterAndAdvice();

            // 4. Hiệu ứng pháo hoa
            confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
            
            // Cập nhật lại lịch quay
            updateDrawInfo();
        }, 1200);
    }

    function renderDigits(numStr) {
        return numStr.split('').map(d => `<div class="digit-box">${d}</div>`).join('');
    }

    // Hàm chạy Jackpot Meter và xử lý High Alert
    function animateMeterAndAdvice() {
        const fill = document.getElementById('bar-fill');
        const label = document.getElementById('percent-label');
        const badge = document.getElementById('highAlertBadge');
        const adviceBox = document.getElementById('adviceBox');
        
        fill.style.transition = 'none';
        fill.style.width = '0%';
        badge.innerHTML = '';
        
        // Random giá trị AI Score từ 60-95%
        let aiScore = Math.floor(Math.random() * 36) + 60;
        
        setTimeout(() => {
            fill.style.transition = 'width 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67)';
            fill.style.width = aiScore + '%';
            label.innerText = aiScore + '%';

            // Lời khuyên dựa trên thời gian thực và AI Score
            if (aiScore >= 90) {
                badge.innerHTML = '<span class="high-alert-tag">HIGH ALERT</span>';
                adviceBox.innerHTML = `🚀 <strong style="color:#ff4d4d;">Lời khuyên AI:</strong> Tín hiệu Jackpot siêu "chín" (${aiScore}%). <strong>NÊN VÀO TIỀN!</strong>`;
                adviceBox.style.background = 'rgba(237, 28, 36, 0.4)';

                // Âm thanh & Popup High Alert
                setTimeout(() => {
                    playHighAlertSound();
                    triggerVibration([200, 100, 200, 100, 300]);
                    openModal(`Bộ số phân tích đạt điểm số AI ${aiScore}% (HIGH ALERT)! Dữ liệu cho thấy tín hiệu rất cao.`);
                }, 1000);

            } else if (aiScore >= 75) {
                adviceBox.innerHTML = `📊 <strong style="color:#ffd700;">Lời khuyên AI:</strong> Độ "chín" trung bình khá (${aiScore}%). Cân nhắc thăm dò.`;
                adviceBox.style.background = 'rgba(255, 215, 0, 0.2)';
            } else {
                adviceBox.innerHTML = `👀 <strong style="color:#66ccff;">Lời khuyên AI:</strong> Tín hiệu chưa tối ưu (${aiScore}%). <strong>TIẾP TỤC QUAN SÁT.</strong>`;
                adviceBox.style.background = 'rgba(255, 255, 255, 0.1)';
            }
        }, 50);
    }

    function openModal(msg) {
        document.getElementById('modalMsg').innerText = msg;
        document.getElementById('alertModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('alertModal').classList.remove('active');
    }

    // Khởi tạo ban đầu
    updateDrawInfo();
</script>
</body>
</html>
