<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Max 3D+ AI Pro</title>

    <!-- Support Add to Home Screen (PWA) -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Max 3D+ AI">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ed1c24">
    <link rel="icon" sizes="192x192" href="icon.png">
    <link rel="icon" sizes="512x512" href="icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { --vietlott-red: #ed1c24; --gold: #ffd700; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: linear-gradient(180deg, #ed1c24 0%, #7b0a0e 100%); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: manipulation; }
        .app-wrapper { flex: 1; display: flex; flex-direction: column; max-width: 500px; margin: 0 auto; width: 100%; padding: 15px; box-sizing: border-box; }
        
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 6px 12px; border-radius: 12px; font-size: 11px; margin-bottom: 8px; }
        .led-container { display: flex; align-items: center; gap: 6px; }
        .led { width: 10px; height: 10px; border-radius: 50%; background-color: #00ff00; box-shadow: 0 0 8px #00ff00; }
        .led.blinking { animation: blink 0.8s infinite alternate; }
        @keyframes blink { 0% { opacity: 0.2; } 100% { opacity: 1; } }

        .result-container { flex: 1; background: rgba(0,0,0,0.2); border-radius: 25px; margin: 10px 0; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid rgba(255,255,255,0.2); padding: 15px; overflow-y: auto; position: relative; }
        
        .set-row { display: flex; justify-content: center; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
        .digit-box { width: 48px; height: 68px; background: white; color: #333; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 26px; font-weight: 800; box-shadow: 0 5px 0 #ccc; border: 2px solid #ddd; }
        @media (max-width: 350px) { .digit-box { width: 38px; height: 56px; font-size: 22px; } }
        
        .btn-main { background: var(--gold); border: none; padding: 15px; border-radius: 15px; color: #7b0a0e; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 5px 0 #b8860b; margin-top: 10px; transition: all 0.1s; }
        .btn-main:active { transform: translateY(4px); box-shadow: 0 1px 0 #b8860b; }
        
        #meter-box { width: 90%; margin-top: 10px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; box-sizing: border-box; }
        .bar-bg { height: 12px; background: #333; border-radius: 10px; overflow: hidden; }
        #bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00ff00, #ffd700, #ff0000); transition: width 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        .advice-text { font-size: 11px; margin-top: 6px; text-align: center; font-weight: 600; }

        /* Custom Popup */
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 999; }
        .popup-card { background: white; color: #333; padding: 20px; border-radius: 20px; width: 80%; max-width: 300px; text-align: center; box-shadow: 0 0 20px rgba(255,215,0,0.8); }
        .popup-card h3 { color: #ed1c24; margin: 0 0 10px 0; }
        .popup-btn { background: #ed1c24; color: white; border: none; padding: 8px 20px; border-radius: 10px; margin-top: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="status-bar">
        <div class="led-container">
            <div id="ledIndicator" class="led"></div>
            <span id="connStatus">Đã kết nối vietlott.vn</span>
        </div>
        <div id="liveClock">00:00:00 - T2/T4/T6</div>
    </div>

    <header style="text-align:center;">
        <h2 style="margin:2px;">MAX 3D+ AI PRO</h2>
        <div style="font-size:12px; opacity:0.8;">Luật chơi: 2 bộ số, mỗi bộ 3 chữ số</div>
    </header>

    <main class="result-container">
        <div id="resultDisplay" style="text-align:center; width:100%;">
            <p style="opacity:0.6;">Nhấn nút để bắt đầu phân tích</p>
        </div>

        <div id="meter-box">
            <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px;">
                <span>Jackpot Meter (Độ chín)</span>
                <span id="percent-label">0%</span>
            </div>
            <div class="bar-bg"><div id="bar-fill"></div></div>
            <div id="aiAdvice" class="advice-text" style="color: #ffd700;">Hệ thống sẵn sàng</div>
        </div>
    </main>

    <button class="btn-main" onclick="handleAnalysis()">PHÂN TÍCH BỘ SỐ MỚI</button>
</div>

<!-- Modal Popup Alert -->
<div id="alertPopup" class="popup-overlay">
    <div class="popup-card">
        <h3>🎯 Jackpot Alert!</h3>
        <p style="font-size: 13px;">Đã phát hiện bộ số có xác suất tối ưu nhất theo thuật toán AI cho kỳ quay sắp tới!</p>
        <button class="popup-btn" onclick="closePopup()">ĐÃ HIỂU</button>
    </div>
</div>

<script>
    // Audio Context (Web Audio API)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
    }

    function playBeep(freq, duration) {
        try {
            initAudio();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function triggerVibrate(pattern) {
        if ("vibrate" in navigator) navigator.vibrate(pattern);
    }

    // Realtime Clock & Vietlott Schedule Check
    function updateClock() {
        const now = new Date();
        const days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
        const dayName = days[now.getDay()];
        const timeStr = now.toTimeString().split(' ')[0];
        const isDrawDay = (now.getDay() === 1 || now.getDay() === 3 || now.getDay() === 5);
        
        document.getElementById('liveClock').innerText = `${timeStr} - ${dayName} ${isDrawDay ? '(Kỳ Quay)' : ''}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // LED Simulator (Kết nối vietlott.vn)
    let isConnected = true;
    function toggleConnectionSim() {
        const led = document.getElementById('ledIndicator');
        const text = document.getElementById('connStatus');
        if (isConnected) {
            led.classList.remove('blinking');
            text.innerText = "Đã kết nối vietlott.vn";
        } else {
            led.classList.add('blinking');
            text.innerText = "Đang đồng bộ vietlott.vn...";
        }
    }
    toggleConnectionSim();

    // Random Number Generator
    function generate3Digits() {
        return Math.floor(Math.random() * 1000).toString().padStart(3, '0');
    }

    // Main Analysis Logic
    function handleAnalysis() {
        playBeep(440, 0.1);
        triggerVibrate(50);

        // Chống trùng lặp 2 bộ số
        let set1 = generate3Digits();
        let set2 = generate3Digits();
        while (set1 === set2) {
            set2 = generate3Digits();
        }

        const display = document.getElementById('resultDisplay');
        display.innerHTML = `
            <div style="margin-bottom:8px; font-weight:bold; color:#ffd700; font-size: 13px;">BỘ SỐ 1</div>
            <div class="set-row">${renderDigits(set1)}</div>
            <div style="margin:12px 0 8px 0; font-weight:bold; color:#ffd700; font-size: 13px;">BỘ SỐ 2</div>
            <div class="set-row">${renderDigits(set2)}</div>
        `;

        animateMeter();
    }

    function renderDigits(numStr) {
        return numStr.split('').map(d => `<div class="digit-box">${d}</div>`).join('');
    }

    function animateMeter() {
        const fill = document.getElementById('bar-fill');
        const label = document.getElementById('percent-label');
        const advice = document.getElementById('aiAdvice');
        
        fill.style.transition = 'none';
        fill.style.width = '0%';
        
        let randomVal = Math.floor(Math.random() * 36) + 64; // 64% - 99%
        
        setTimeout(() => {
            fill.style.transition = 'width 1.2s cubic-bezier(0.17, 0.67, 0.83, 0.67)';
            fill.style.width = randomVal + '%';
            label.innerText = randomVal + '%';

            if (randomVal > 85) {
                advice.innerText = "Tín hiệu AI: NÊN VÀO TIỀN (Vùng nhiệt cao)";
                advice.style.color = "#ff4d4d";
            } else {
                advice.innerText = "Tín hiệu AI: TIẾP TỤC QUAN SÁT";
                advice.style.color = "#ffd700";
            }

            // Kết quả xuất hiện
            setTimeout(() => {
                playBeep(880, 0.3);
                triggerVibrate([100, 50, 100]);
                confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 } });

                if (randomVal >= 92) {
                    document.getElementById('alertPopup').style.display = 'flex';
                }
            }, 1200);

        }, 50);
    }

    function closePopup() {
        document.getElementById('alertPopup').style.display = 'none';
    }
</script>
</body>
</html>
